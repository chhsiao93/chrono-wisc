# GNS Dataset Configuration - Default Settings
# Copy and modify this file to create different dataset configurations

simulation:
  t_end: 1.0
  time_step: 5.0e-5
  ps_freq: 1
  output_fps: 400

geometry:
  sphere_density:
    min: 2200
    max: 2200
  sphere_radius:
    min: 0.008
    max: 0.015
  initial_spacing: 0.0025
  Hdrop: 0.2

  # Fluid box parameters (defines SPH particle generation region)
  # Note: Boundary box is 0.1x0.1, so fluid must fit within [-0.05, 0.05] with safety margin
  fluid_box:
    center: [0.0, 0.0, 0.02]
    half_dim: [0.03, 0.03, 0.017]

physics:
  boundary_type: "adami"
  viscosity_type: "artificial_bilateral"
  kernel_type: "cubic"
  d0_multiplier: 1.3

rigid_position:
  randomize: true
  min: [0.01, -0.015, 0.06]
  max: [0.01, 0.015, 0.08]

rigid_velocity:
  randomize: true
  min: [0.35, -0.15, -0.5]
  max: [0.35, 0.15, 0.0]

dataset:
  num_trajectories: 1
  output_base_dir: "GNS_dataset"
  random_seed_base: 0

rendering:
  auto_render: true
  width: 1280
  height: 720
  fps: 10
  format: "mp4"
  cleanup_frames: true
  python_venv: ""
